root = "."
testdata_dir = "testdata"
tmp_dir = "bin"

[build]
cmd = "go build -o ./bin/api ./cmd/api"
bin = "./bin/api"
delay = 1000
exclude_dir = ["bin", "vendor", "testdata", "docs"]
exclude_regex = ["_test.go"]
include_ext = ["go", "tpl", "tmpl", "html"]
kill_delay = "0s"
log = "build-errors.log"
stop_on_error = false

[log]
time = false

[misc]
clean_on_exit = false
